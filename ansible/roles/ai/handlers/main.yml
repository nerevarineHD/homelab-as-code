---
- name: Restart ollama
  ansible.builtin.systemd_service:
    name: ollama
    state: restarted
    daemon_reload: true

- name: Restart open-webui
  ansible.builtin.command: docker compose up -d --force-recreate
  args:
    chdir: "{{ ai_dir }}"
  changed_when: true   # only runs when needed (when:/handler)
