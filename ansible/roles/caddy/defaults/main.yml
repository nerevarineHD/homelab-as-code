caddy_domain: example.net
caddy_bin: /usr/local/bin/caddy
# Caddy's build service; returns a static binary including the Cloudflare DNS plugin.
caddy_download_url: "https://caddyserver.com/api/download?os=linux&arch=amd64&p=github.com%2Fcaddy-dns%2Fcloudflare&p=github.com%2Fhslatman%2Fcaddy-crowdsec-bouncer"  # noqa: yaml[line-length]
# Services proxied as <name>.example.net -> upstream (each LAN upstream also needs a DMZ->LAN ACL exception)
caddy_services:
  - { name: jellyfin, upstream: "192.168.0.21:8096" }
  - { name: request, upstream: "192.168.0.13:5055" }
