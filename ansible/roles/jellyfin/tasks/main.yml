# Jellyfin from its official repo. App data (users, libraries, watch history, metadata)
# lives in /var/lib/jellyfin and comes back from vzdump restores.
- name: Prerequisites
  ansible.builtin.apt:
    name: [curl, gnupg, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Jellyfin repo signing key (dearmored)
  ansible.builtin.shell: >  # noqa: command-instead-of-module (pipes into gpg --dearmor)
    curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key
    | gpg --dearmor -o /etc/apt/keyrings/jellyfin.gpg
  args:
    creates: /etc/apt/keyrings/jellyfin.gpg

- name: Jellyfin apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/jellyfin.sources
    mode: "0644"
    content: |
      Types: deb
      URIs: https://repo.jellyfin.org/debian
      Suites: {{ ansible_distribution_release }}
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/jellyfin.gpg

- name: Jellyfin installed
  ansible.builtin.apt:
    name: jellyfin
    state: present
    update_cache: true

- name: Jellyfin running
  ansible.builtin.systemd_service:
    name: jellyfin
    enabled: true
    state: started
