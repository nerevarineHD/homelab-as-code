apiVersion: 1
providers:
  - name: homelab
    folder: Homelab
    type: file
    disableDeletion: true      # dashboards come from the repo; can't be deleted in the UI
    allowUiUpdates: false      # edit the JSON in the repo, not in Grafana
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana-dashboards
