global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
  - job_name: proxmox-host
    static_configs: [{targets: ['192.168.0.10:9100']}]
  - job_name: pve
    static_configs:
      - targets: ['192.168.0.10']
    metrics_path: /pve
    params:
      module: [default]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221
  - job_name: zfs
    scrape_interval: 60s
    static_configs: [{targets: ['192.168.0.10:9134']}]
  - job_name: crowdsec
    static_configs: [{targets: ['192.168.30.10:6060'], labels: {instance: proxy}}]
