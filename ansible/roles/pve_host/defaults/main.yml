# renovate: datasource=github-releases depName=pdf/zfs_exporter
pve_host_zfs_exporter_version: "2.3.12"
# renovate: datasource=github-releases depName=gitleaks/gitleaks
pve_host_gitleaks_version: "8.28.0"      # secret scanner used by scripts/publish-public.sh
pve_host_packages:
  - sanoid
  - mbuffer
  - pv
  - smartmontools
  - prometheus-node-exporter
  - prometheus-node-exporter-collectors
  - restic
  - git
  - tmux
  - unrar
# Discord embed body for Proxmox notifications (base64, as stored by Proxmox)
pve_host_discord_body_b64: ""  # noqa: yaml[line-length]
pve_host_discord_matcher: dicord-alerts
