[media/library]
    use_template = media
    recursive = yes

[bulk/games]
    use_template = media
    recursive = yes

[bulk/random]
    use_template = media
    recursive = yes

[template_media]
    hourly = 0
    daily = 14
    monthly = 6
    yearly = 0
    autosnap = yes
    autoprune = yes

# --- backup pool: receive-only, prune old replicated snapshots ---
[backup/media-library]
	use_template = backup_target
	recursive = yes
[backup/bulk-games]
	use_template = backup_target
	recursive = yes
[backup/bulk-random]
	use_template = backup_target
	recursive = yes

[template_backup_target]
	autosnap = no
	autoprune = yes
	hourly = 0
	daily = 30
	monthly = 12
	yearly = 0
